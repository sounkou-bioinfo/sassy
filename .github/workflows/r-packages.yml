name: R packages

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  r-cmd-check:
    name: R CMD check (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: Rsassy
            path: r/Rsassy
          - name: sassyRS
            path: r/sassyRS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils

      - name: Install R test dependencies
        shell: Rscript {0}
        run: |
          install.packages("tinytest")

      - name: Build source package
        run: |
          R CMD build "${{ matrix.package.path }}"
          tarball="$(ls -t ${{ matrix.package.name }}_*.tar.gz | head -n 1)"
          echo "TARBALL=${tarball}" >> "${GITHUB_ENV}"

      - name: Check source package
        run: R CMD check --no-manual --no-vignettes "${TARBALL}"

      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-cmd-check-${{ matrix.package.name }}
          path: |
            ${{ matrix.package.name }}.Rcheck
            ${{ matrix.package.name }}_*.tar.gz

  benchmark-r-bindings:
    name: Benchmark Rsassy, sassyRS, and Python sassy
    runs-on: ubuntu-latest
    needs: r-cmd-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils

      - name: Install R benchmark dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("tinytest", "rmarkdown", "reticulate"))

      - name: Prepare Python benchmark environment
        run: uv venv --python 3.11 .venv-benchmark && uv pip install --python .venv-benchmark sassy-rs

      - name: Run binding benchmark report
        env:
          NOT_CRAN: "true"
          RUSTFLAGS: "-C target-cpu=native"
          SASSY_RUST_FEATURES: native-simd
          SASSY_R_BENCH_BATCHES: 5
          SASSY_R_BENCH_ITERS: 10
          SASSY_R_BENCH_TEXT_LENGTH: 1000000
          SASSY_R_BENCH_OUT: benchmark-results/r-bindings.csv
        run: |
          mkdir -p benchmark-results
          R CMD INSTALL r/Rsassy
          R CMD INSTALL r/sassyRS
          export RETICULATE_PYTHON="$PWD/.venv-benchmark/bin/python"
          Rscript - <<'RSCRIPT'
          rmarkdown::render(
            "r/benchmarks/benchmark-r-bindings.Rmd",
            output_format = "html_document",
            output_dir = "benchmark-results",
            output_file = "r-bindings.html",
            envir = new.env(parent = globalenv())
          )
          rmarkdown::render(
            "r/benchmarks/benchmark-r-bindings.Rmd",
            output_format = "github_document",
            output_dir = "benchmark-results",
            output_file = "r-bindings.md",
            envir = new.env(parent = globalenv())
          )
          RSCRIPT

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: r-binding-benchmark
          path: |
            benchmark-results/r-bindings.csv
            benchmark-results/r-bindings.html
            benchmark-results/r-bindings.md
