name: R package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  r-cmd-check:
    name: R CMD check (Rsassy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils

      - name: Install R test dependencies
        shell: Rscript {0}
        run: install.packages("tinytest")

      - name: Build source package
        run: |
          R CMD build r/Rsassy
          echo "TARBALL=$(ls -t Rsassy_*.tar.gz | head -n 1)" >> "$GITHUB_ENV"

      - name: Check source package
        run: R CMD check --no-manual --no-vignettes "$TARBALL"

      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-cmd-check-Rsassy
          path: |
            Rsassy.Rcheck
            Rsassy_*.tar.gz
