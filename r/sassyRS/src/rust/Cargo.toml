[package]
name = "sassyrs"
publish = false
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[lib]
crate-type = ["rlib", "staticlib"]
name = "sassyrs"

[[bin]]
name = "document"
path = "document.rs"

[features]
default = ["portable"]
# Portable/CRAN-safe fallback. The benchmark workflow disables this and uses
# `native-simd` with `RUSTFLAGS=-C target-cpu=native`.
portable = ["sassy/scalar"]
native-simd = []

[dependencies]
extendr-api = "0.9.0"
sassy = { version = "0.2.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1

[workspace]
